<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sakuya's Haunted Cauldron</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main id="scene" aria-label="Haunted cauldron overlay">
    <section id="cauldron-widget" class="cauldron-widget" aria-live="polite">

      <!-- GIF'lerinin yükleneceği ve app.js'in aradığı ana resim etiketi -->
      <img id="cauldronArt" src="/assets/cauldron-idle.gif" alt="Cauldron" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; z-index: 1;">

      <!-- Eşya atıldığında çalışan emojilerin barınacağı katman -->
      <div id="flyLayer" style="position: absolute; inset: 0; z-index: 2; pointer-events: none;"></div>

      <div class="progress-area">
        <div class="progress-meta"><span class="progress-label">CAULDRON</span><span id="progress-value">0%</span></div>
        <div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div>
      </div>

      <div id="potion-result" class="potion-result" aria-live="assertive" style="z-index: 6;">
        <span class="potion-bottle" aria-hidden="true">🧪</span>
        <span id="potion-message">POTION BREWED!</span>
      </div>

      <div id="status-chip" class="status-chip" style="z-index: 6;">Waiting for chat...</div>
    </section>

    <!-- Active rewards and punishments persist until a moderator/streamer uses !done. -->
    <section id="active-outcomes" class="active-outcomes" aria-live="polite" aria-label="Active rewards and punishments" aria-hidden="true">
      <header class="active-outcomes-header"><span>✦</span><span id="active-outcomes-title">ACTIVE QUESTS</span></header>
      <div id="active-outcome-list" class="active-outcome-list"></div>
      <footer class="active-outcomes-footer">Streamer or moderator: <b>!done</b></footer>
    </section>

    <div id="confetti-layer" class="confetti-layer" aria-hidden="true"></div>

    <!-- Ceza oylaması paneli: sunucudan gelen voteStart/voteUpdate/voteEnd olaylarıyla çalışır -->
    <section id="vote-panel" class="vote-panel" aria-live="polite" aria-hidden="true">
      <header class="vote-head">
        <div class="vote-title"><span class="vote-skull" aria-hidden="true">💀</span><span id="vote-title-text">PUNISHMENT VOTE</span></div>
        <div class="vote-clock" id="vote-clock"><span id="vote-seconds">30</span><small>s</small></div>
      </header>
      <p class="vote-hint" id="vote-hint">Type <b>1</b> – <b>5</b> in chat to vote</p>
      <ol id="vote-list" class="vote-list"></ol>
      <div class="vote-timer"><div id="vote-timer-fill" class="vote-timer-fill"></div></div>
      <footer id="vote-result" class="vote-result">
        <div id="vote-result-kicker" class="vote-result-kicker"></div>
        <div id="vote-result-label" class="vote-result-label"></div>
      </footer>
    </section>

    <section id="test-panel" class="test-panel" aria-label="Test controls">
      <div class="test-title">CAULDRON TEST MODE</div>
      <div class="test-buttons">
        <button id="test-throw" type="button">Test !throw</button>
        <button id="test-start-vote" type="button">Start vote</button>
        <button id="test-vote" type="button">Test vote</button>
        <button id="test-reset" type="button" class="muted-button">Reset</button>
      </div>
      <div class="test-help">Hidden in OBS unless the URL contains <code>?test=1</code>.</div>
    </section>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
